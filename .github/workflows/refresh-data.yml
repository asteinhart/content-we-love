name: Refresh data

# Run by hand from the Actions tab whenever new content is added in Airtable.
on: workflow_dispatch

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests pandas numpy

      - name: Pull records from Airtable
        env:
          AIRTABLE_KEY: ${{ secrets.AIRTABLE_KEY }}
        run: python build_data.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/records.json
          git diff --staged --quiet || git commit -m "refresh data"
          git push
